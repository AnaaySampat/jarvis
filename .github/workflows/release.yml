# Push a tag vX.Y.Z (matching jarvis-studio-gui/package.json and tauri.conf.json) and
# this checks the app, builds a signed APK and publishes it as a GitHub release, which
# the app's update notice (platform/update.ts) then offers. Run it by hand ("Run
# workflow") for a dry run: same checks and build, the APK as a workflow artifact, no
# release.
#
# Signing: the APK must carry the key the installed app was signed with, or Android
# refuses the update. Add repository secrets ANDROID_KEYSTORE_BASE64 (the keystore file,
# base64), ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD (gen/android uses one password
# for store and key). For the debug keystore the app may have been built with so far:
# ~/.android/debug.keystore, alias androiddebugkey, password android.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
      REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    defaults:
      run:
        working-directory: jarvis-studio-gui
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the app's version
        if: env.PUBLISH == 'true'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$pkg" != "$tag" ] || [ "$conf" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but package.json says $pkg and tauri.conf.json says $conf. Bump both, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jarvis-studio-gui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install packages
        run: npm ci
      - name: Typecheck, lint, tests
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:contracts
          npm run test:release-gate
          node --test ../scripts/build-android-update.test.mjs

      - name: Stable foundation promotion requires live acceptance evidence
        if: env.PUBLISH == 'true' && !contains(github.ref_name, '-')
        run: npm run check:foundation-gate

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::No signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD). An APK signed with a throwaway key can't update the installed app, so nothing is published."
              exit 1
            fi
            if [ "$REQUIRE_SIGNING" = "true" ]; then
              echo "::warning::Signing secrets are missing. Building an unsigned release APK for local signing; no replacement key is generated."
              echo "JARVIS_UNSIGNED_RELEASE=1" >> "$GITHUB_ENV"
              echo "APK_UNSIGNED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::No signing secrets: this dry run is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > src-tauri/gen/android/release.keystore
          printf 'storeFile=../release.keystore\nkeyAlias=%s\npassword=%s\n' "$KEY_ALIAS" "$KEY_PASSWORD" \
            > src-tauri/gen/android/keystore.properties

      - name: Build the APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: npx tauri android build --apk --target aarch64

      - name: Native regression tests
        working-directory: jarvis-studio-gui/src-tauri/gen/android
        run: ./gradlew :tauri-plugin-phone:testReleaseUnitTest

      - name: Name it
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$APK_UNSIGNED" = "true" ]; then
            name="JARVIS-v${version}-arm64-unsigned.apk"
            source=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          else
            name="JARVIS-v${version}-arm64.apk"
            source=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          fi
          cp "$source" "$name"
          echo "APK=jarvis-studio-gui/$name" >> "$GITHUB_ENV"

      - name: Verify the signed APK and build updater metadata
        if: env.APK_UNSIGNED != 'true'
        run: |
          node ../scripts/build-android-update.mjs "${APK#jarvis-studio-gui/}" android-update.json

      - name: Publish complete release assets
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${APK#jarvis-studio-gui/}" android-update.json --draft --verify-tag --title "JARVIS ${GITHUB_REF_NAME#v}" --notes-file "../docs/releases/${GITHUB_REF_NAME}.md" "${flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Keep the dry run's APK
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_UNSIGNED == 'true' && 'jarvis-unsigned-release-apk' || 'jarvis-release-apk' }}
          path: |
            ${{ env.APK }}
            jarvis-studio-gui/android-update.json
